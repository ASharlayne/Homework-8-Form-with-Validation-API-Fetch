<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch</title>
<style>
  :root {
    --ink: #1c2a24;
    --paper: #f6f5f0;
    --line: #d8d6cc;
    --accent: #3c5a45;
    --accent-soft: #e7ede8;
    --error: #9a3324;
    --error-soft: #f8e9e6;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3rem 1.25rem;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.85rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 0.4rem;
  }

  p.intro {
    margin: 0 0 2rem;
    color: #4c5a53;
    max-width: 34ch;
  }

  form {
    border-top: 1px solid var(--line);
    padding-top: 1.75rem;
  }

  .field {
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 0.4rem;
    color: var(--ink);
  }

  input,
  textarea {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
  }

  textarea {
    min-height: 6rem;
    resize: vertical;
  }

  input:focus,
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  input[aria-invalid="true"],
  textarea[aria-invalid="true"] {
    border-color: var(--error);
  }

  .error-message {
    display: block;
    min-height: 1.1rem;
    margin-top: 0.35rem;
    font-size: 0.85rem;
    color: var(--error);
  }

  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 0.7rem 1.4rem;
    border-radius: var(--radius);
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
  }

  button:hover { background: #2e4636; }
  button:disabled { background: #93a89c; cursor: wait; }

  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #form-status {
    margin-top: 1.25rem;
    padding: 0.9rem 1rem;
    border-radius: var(--radius);
    font-size: 0.95rem;
    display: none;
  }

  #form-status.visible { display: block; }

  #form-status.success {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid #c3d3c8;
  }

  #form-status.failure {
    background: var(--error-soft);
    color: var(--error);
    border: 1px solid #e3c3bc;
  }

  #form-status blockquote {
    margin: 0.5rem 0 0;
    padding-left: 0.75rem;
    border-left: 2px solid currentColor;
    font-style: italic;
  }

  @media (prefers-reduced-motion: no-preference) {
    #form-status.visible { animation: settle 0.2s ease-out; }
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<main>
  <h1>Get in touch</h1>
  <p class="intro">Fill this out and we'll follow up within a couple of days.</p>

  <form id="contact-form" novalidate>
    <div class="field">
      <label for="full-name">Full name</label>
      <input type="text" id="full-name" name="full-name" aria-describedby="full-name-error">
      <span class="error-message" id="full-name-error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" aria-describedby="email-error">
      <span class="error-message" id="email-error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="0" aria-describedby="age-error">
      <span class="error-message" id="age-error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" aria-describedby="message-error"></textarea>
      <span class="error-message" id="message-error" aria-live="polite"></span>
    </div>

    <button type="submit" id="submit-btn">Send message</button>

    <div id="form-status" role="status"></div>
  </form>
</main>

<script>
(function () {
  const form = document.getElementById('contact-form');
  const submitBtn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');

  const fields = {
    'full-name': {
      input: document.getElementById('full-name'),
      error: document.getElementById('full-name-error'),
      validate: (v) => v.trim() === '' ? 'Enter your full name.' : ''
    },
    'email': {
      input: document.getElementById('email'),
      error: document.getElementById('email-error'),
      validate: (v) => {
        if (v.trim() === '') return 'Enter your email address.';
        if (!v.includes('@')) return 'Include an @ in your email address.';
        return '';
      }
    },
    'age': {
      input: document.getElementById('age'),
      error: document.getElementById('age-error'),
      validate: (v) => v.trim() === '' ? 'Enter your age.' : ''
    },
    'message': {
      input: document.getElementById('message'),
      error: document.getElementById('message-error'),
      validate: (v) => v.trim() === '' ? 'Enter a message.' : ''
    }
  };

  // Clear a field's error as soon as the user starts correcting it.
  Object.values(fields).forEach(({ input, error, validate }) => {
    input.addEventListener('input', () => {
      const problem = validate(input.value);
      if (!problem) {
        error.textContent = '';
        input.removeAttribute('aria-invalid');
      }
    });
  });

  function showStatus(kind, html) {
    status.className = 'visible ' + kind;
    status.innerHTML = html;
  }

  function clearStatus() {
    status.className = '';
    status.innerHTML = '';
  }

  async function fetchAdvice() {
    // Bonus: free public API call, no key required.
    const response = await fetch('https://api.adviceslip.com/advice');
    if (!response.ok) {
      throw new Error('Request failed with status ' + response.status);
    }
    const data = await response.json();
    return data.slip && data.slip.advice ? data.slip.advice : null;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    clearStatus();

    let firstInvalid = null;

    Object.values(fields).forEach(({ input, error, validate }) => {
      const problem = validate(input.value);
      error.textContent = problem;
      if (problem) {
        input.setAttribute('aria-invalid', 'true');
        if (!firstInvalid) firstInvalid = input;
      } else {
        input.removeAttribute('aria-invalid');
      }
    });

    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    fetchAdvice()
      .then((advice) => {
        const quote = advice
          ? '<blockquote>' + advice + '</blockquote>'
          : '';
        showStatus('success', 'Thanks, ' + fields['full-name'].input.value.trim() + ' — your message is in. Here\'s something to read while you wait:' + quote);
        form.reset();
      })
      .catch(() => {
        showStatus('failure', 'Your message was valid, but we could not reach the advice service just now. Please try again shortly.');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send message';
      });
  });
})();
</script>
</body>
</html>
