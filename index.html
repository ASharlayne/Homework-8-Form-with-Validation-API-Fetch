<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in touch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Get in touch</h1>
    <p class="intro">Fill this out and we'll follow up within a couple of days.</p>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="full-name" aria-describedby="full-name-error">
        <span class="error-message" id="full-name-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" aria-describedby="email-error">
        <span class="error-message" id="email-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="0" aria-describedby="age-error">
        <span class="error-message" id="age-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" aria-describedby="message-error"></textarea>
        <span class="error-message" id="message-error" aria-live="polite"></span>
      </div>

      <button type="submit" id="submit-btn">Send message</button>
      <div id="form-status" role="status"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
